plugins {
	id 'application'
}

// SkyPilot Launcher: a desktop app that prepares a Fabric 26.2 "SkyPilot" profile for the
// official Minecraft Launcher (which keeps doing the Microsoft sign-in and starts the game).
// It bundles the SkyPilot mod jar built in this repository and pins Fabric API by SHA-512.

// The mod's jar task must exist before this script looks it up.
evaluationDependsOn(':platform:mc26_2')

dependencies {
	implementation project(':core')
	implementation project(':network')
	implementation "com.google.code.gson:gson:${gson_version}"
	implementation "com.formdev:flatlaf:${flatlaf_version}"

	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	systemProperty 'java.awt.headless', 'true' // the page screenshots are painted without a window
}

application {
	mainClass = 'dev.skypilot.launcher.LauncherMain'
	applicationName = 'skypilot-launcher'
}

def modJar = project(':platform:mc26_2').tasks.named('jar').flatMap { it.archiveFile }
def modIcon = project(':platform:mc26_2').file('src/main/resources/assets/skypilot/icon.png')
def pins = [
		minecraft    : project.property('minecraft_version'),
		loader       : project.property('loader_version'),
		modVersion   : project.property('mod_version'),
		fabricApi    : project.property('fabric_api_version'),
		fabricApiUrl : project.property('fabric_api_url'),
		fabricApiSha : project.property('fabric_api_sha512'),
		fabricApiSize: project.property('fabric_api_size'),
]

// The mod jar, its SHA-256 and the pinned versions go into the launcher's resources.
def bundle = tasks.register('bundleMod') {
	description = 'Copies the SkyPilot mod jar into the launcher and records its SHA-256 and the pinned versions.'
	// Bundle the jar after it is signed (signJar is skipped when no keystore is configured).
	dependsOn ':platform:mc26_2:signJar'
	inputs.file(modJar)
	inputs.file(modIcon)
	inputs.property('pins', pins.toString())
	def out = layout.buildDirectory.dir('bundled')
	outputs.dir(out)
	doLast {
		def dir = out.get().dir('bundled').asFile
		dir.mkdirs()
		def jar = modJar.get().asFile
		def target = new File(dir, 'skypilot-mod.jar')
		target.bytes = jar.bytes
		new File(dir, 'icon.png').bytes = modIcon.bytes
		def md = java.security.MessageDigest.getInstance('SHA-256')
		md.update(target.bytes)
		def props = new Properties()
		props.setProperty('mod.sha256', md.digest().encodeHex().toString())
		props.setProperty('mod.file', 'skypilot-' + pins.modVersion + '.jar')
		pins.each { k, v -> props.setProperty(k, v.toString()) }
		new File(dir, 'pins.properties').withWriter('UTF-8') { props.store(it, 'SkyPilot launcher pins (generated)') }
	}
}
sourceSets.main.resources.srcDir(bundle.map { layout.buildDirectory.dir('bundled').get() })

// One runnable jar (java -jar build/libs/skypilot-launcher-all.jar).
tasks.register('launcherJar', Jar) {
	description = 'Builds a single runnable launcher jar.'
	archiveBaseName = 'skypilot-launcher'
	archiveClassifier = 'all'
	manifest { attributes 'Main-Class': application.mainClass.get(), 'Implementation-Title': 'SkyPilot Launcher', 'Implementation-Version': project.version }
	from sourceSets.main.output
	dependsOn configurations.runtimeClasspath
	from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } } {
		exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('assemble') { dependsOn 'launcherJar' }

// A self-contained app (bundled Java runtime) with jpackage: build/jpackage/SkyPilot Launcher/.
def jpackageExe = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.map {
	it.metadata.installationPath.file('bin/jpackage' + (System.getProperty('os.name').toLowerCase().contains('win') ? '.exe' : '')).asFile.absolutePath
}
// Only the runnable jar goes into the app (the plain jar stays out).
def jpackageInput = tasks.register('jpackageInput', Sync) {
	from tasks.named('launcherJar')
	into layout.buildDirectory.dir('jpackage-input')
}
tasks.register('jpackageImage', Exec) {
	description = 'Builds a self-contained launcher app image with jpackage.'
	dependsOn jpackageInput
	def inputDir = layout.buildDirectory.dir('jpackage-input').get().asFile
	def jarName = tasks.named('launcherJar').flatMap { it.archiveFileName }
	def destDir = layout.buildDirectory.dir('jpackage').get().asFile
	def appVersion = project.version.toString()
	def mainCls = application.mainClass
	doFirst {
		destDir.deleteDir()
		if (destDir.exists()) throw new GradleException("cannot delete ${destDir} - is SkyPilot Launcher.exe still running?")
		executable jpackageExe.get()
		// Modules from `jdeps --print-module-deps` (+ jdk.charsets for console output on Windows).
		args '--type', 'app-image', '--name', 'SkyPilot Launcher', '--app-version', appVersion,
				'--input', inputDir.absolutePath, '--main-jar', jarName.get(), '--main-class', mainCls.get(),
				'--add-modules', 'java.base,java.desktop,java.net.http,java.sql,jdk.charsets,jdk.management',
				'--dest', destDir.absolutePath,
				'--vendor', 'SkyPilot', '--description', 'Sets up SkyPilot for the official Minecraft Launcher'
	}
}
