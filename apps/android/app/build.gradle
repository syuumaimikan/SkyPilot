plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.skypilot.android'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.skypilot.android'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.5.0'
        def defaultServer = providers.gradleProperty('defaultServerUrl').getOrElse('')
        if (defaultServer && !(defaultServer ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?\/?/)) {
            throw new GradleException('defaultServerUrl must be an HTTPS origin')
        }
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + defaultServer + '"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
