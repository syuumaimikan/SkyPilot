name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: node scripts/test-money-workbench.mjs
      - run: node scripts/test-rustdesk.mjs
      - run: node scripts/test-adventure.mjs
      - run: node scripts/test-play-lab.mjs
      - run: pnpm build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build, test and lint Android
        working-directory: apps/android
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: skypilot-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build and test (Gradle provisions JDK 25 for the daemon)
        working-directory: apps/mod
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: skypilot-mod
          path: |
            apps/mod/platform/mc26_2/build/libs/*.jar
            apps/mod/platform/mc26_2/build/libs/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: skypilot-launcher-jar
          path: apps/launcher/build/libs/skypilot-launcher-*-all.jar

  launcher-windows:
    # The Windows app (with its own Java runtime) - built on pushes to main only.
    if: github.event_name == 'push'
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install WiX Toolset 5 (for the installer)
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build the app image and the installer
        working-directory: apps/mod
        shell: bash
        run: ./gradlew :launcher:jpackageImage :launcher:jpackageInstaller --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: skypilot-launcher-windows
          path: apps/launcher/build/jpackage/
      - uses: actions/upload-artifact@v4
        with:
          name: skypilot-launcher-installer
          path: apps/launcher/build/installer/*.exe
