# Farming crops. Base drops and NPC prices per harvested block come from EliteFarmers
# farming-weight `crops.ts` (MIT, github.com/EliteFarmers/Website/packages/farming-weight).
# Farming Fortune: +1% drops per point (wiki "Farming Fortune").
source = "https://github.com/EliteFarmers/Website/blob/master/packages/farming-weight/src/constants/crops.ts"

# Hypixel limits block breaking; 20 blocks/second is the practical maximum used by
# community calculators. SkyPilot applies `default_uptime` for movement/lane changes.
max_blocks_per_second = 20
default_uptime = 0.9

[[crops]]
id = "WHEAT"
