# SkyBlock calendar. Event dates from https://hypixelskyblock.minecraft.wiki/w/Calendar_and_Events
# (checked 2026-10-05). One SkyBlock day = 20 real minutes, 31 days per month, 12 months.
# The epoch (Year 1, Early Spring 1) is 1560275700000 ms; this matches the live election
# endpoint (election year N runs from Late Summer 27 of year N to Late Spring 27 of N+1).
epoch_ms = 1560275700000
day_ms = 1200000
days_per_month = 31
months = ["Early Spring", "Spring", "Late Spring", "Early Summer", "Summer", "Late Summer", "Early Autumn", "Autumn", "Late Autumn", "Early Winter", "Winter", "Late Winter"]

