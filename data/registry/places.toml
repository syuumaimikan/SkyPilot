# Where a recommended action is done, so the mod's "Guide" button can draw a line to a fixed
# public place. `action` is an action-id prefix (longest match wins); `place` is a place name
# from SkyHanni-REPO's island graphs (MIT) and is checked by `cargo test`. Without `place`, the
# guide points at the island's warp landing. The warp shown to the player is the island's warp
# landing closest to the place (graph nodes tagged `warp`); it is only put into the chat box.
# NPC roles: Hypixel SkyBlock Wiki (pages linked per entry), checked 2026-10-06.

[[places]]
action = "slayer-gear-"
island = "HUB"
