# Mining areas and their entry requirements (wiki Crystal Hollows / Glacite Tunnels pages,
# checked 2026-10-05). Gemstones drop 3-5 Rough by default (wiki "Gemstone"), modelled as 4.
[[areas]]
id = "dwarven_mines"
name = "Dwarven Mines"
required_hotm = 0
description = "Commissions, mithril and titanium. Entry via the Gold Mine."

[[areas]]
id = "crystal_hollows"
name = "Crystal Hollows"
required_hotm = 4
required_mining = 12
description = "Gemstones in five zones, treasure chests (gemstone powder) and the Crystal Nucleus."

[[areas]]
id = "glacite_tunnels"
name = "Glacite Tunnels"
required_hotm = 7
description = "Glacite, umber, tungsten, onyx/aquamarine/citrine/peridot gemstones, frozen corpses."

[[areas]]
id = "glacite_mineshafts"
name = "Glacite Mineshafts"
required_hotm = 7
description = "Instanced shafts with dense gemstone/ore and corpses; spawn with a 0.05% chance per block broken in the Glacite Tunnels."

# ---- HOTM presets (SkyPilot heuristics). Values are target levels per perk id
# (NEU hotmlayout perk ids). The planner computes the powder still needed from the player's
# current tree, respecting HOTM tier unlocks and tree adjacency.
[[hotm_presets]]
id = "progression"
name = "HOTM Progression"
description = "Balanced tree that unlocks the most universally useful perks first."
ability = "mining_speed_boost"
targets = { core_of_the_mountain = 10, mining_speed = 50, mining_fortune = 50, efficient_miner = 100, quick_forge = 20, professional = 140, mole = 200, powder_buff = 50, seasoned_mineman = 100, great_explorer = 20, fortunate_mineman = 50, sky_mall = 1, mining_speed_boost = 1, daily_powder = 1, front_loaded = 1 }

[[hotm_presets]]
id = "powder"
name = "Powder Grinding"
description = "Maximise powder income (Powder Buff, Great Explorer chests, Front Loaded)."
ability = "pickobulus"
targets = { core_of_the_mountain = 10, powder_buff = 50, great_explorer = 20, mole = 200, efficient_miner = 100, mining_speed = 50, front_loaded = 1, daily_powder = 1, sky_mall = 1, pickobulus = 1 }

[[hotm_presets]]
id = "gemstone"
name = "Gemstone Mining"
description = "Gemstone throughput: Professional, Gem Lover, Strong Arm/Steady Hand, Crystalline."
ability = "mining_speed_boost"
targets = { core_of_the_mountain = 10, mining_speed = 50, professional = 140, gem_lover = 20, strong_arm = 100, steady_hand = 100, crystalline = 50, fortunate_mineman = 50, front_loaded = 1, mining_speed_boost = 1, sky_mall = 1 }

[[hotm_presets]]
