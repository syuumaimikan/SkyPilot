# Mining targets and planners.
# Game facts (block strength, instant-break factors, powder per mithril block) from
# https://hypixelskyblock.minecraft.wiki/w/Mining_Speed and /w/Mithril_Powder (checked 2026-10-05).
# Items, drill stats and HOTM costs are NOT duplicated here: they come from the Hypixel items
# resource and NEU hotmlayout.json.

source = "https://hypixelskyblock.minecraft.wiki/w/Mining_Speed"
default_uptime = 0.75
# Powder Buff: +1% powder per level (wiki, Powder Buff perk), applied multiplicatively to the base.
powder_buff_perk = "powder_buff"

# fortune_stat: which lore/item stat applies ("MINING_FORTUNE", "GEMSTONE_FORTUNE", ...).
# Since the 2024 mining update several specialised fortunes exist; SkyPilot sums the generic
