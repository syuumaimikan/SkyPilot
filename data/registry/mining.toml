# ---- Powder planner methods. Verified per-block values are marked; everything else is an
# editable SkyPilot assumption shown to the user with LOW confidence.
[[powder_methods]]
id = "mithril_mining"
powder = "MITHRIL"
name = "Mine mithril"
kind = "per_block"
target = "mithril"
powder_per_block = 2.0
verified = true
note = "Wiki: 1 powder for basic variants, 2 for prismarine, 5 for light blue wool. 2 is a mixed average."

[[powder_methods]]
id = "gemstone_chests"
powder = "GEMSTONE"
name = "Crystal Hollows treasure chests"
kind = "per_hour"
per_hour = 120000
verified = false
note = "Assumption: chest farming with Great Explorer. Highly variable - adjust in the planner."

[[powder_methods]]
id = "glacite_mineshafts"
powder = "GLACITE"
name = "Glacite Tunnels / Mineshafts loop"
kind = "per_hour"
per_hour = 90000
verified = false
note = "Assumption: commissions + corpses + glacite mining. Adjust to your observed rate."
