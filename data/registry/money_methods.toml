# Money-making methods evaluated per player. The coins/hour of every method is COMPUTED
# at request time by its estimator (live market prices x the player's stats); nothing here
# is a fixed "X M/h" number. `requirements` use the same mini-language as goal nodes:
#   skill:<SKILL>>=N, slayer:<id>>=N, catacombs>=N, hotm>=N, garden>=N, floor:<F7|M3>, purse>=N

[[methods]]
id = "farming_best_crop"
name = "Garden farming (best crop for you)"
category = "Farming"
estimator = "farming"
risk = "VERY_LOW"
requirements = ["garden>=1"]
link = "/farming"

