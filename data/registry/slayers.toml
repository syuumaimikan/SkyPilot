# SlayerDefinition registry. Adding a new slayer = adding a [[slayers]] entry here
# (and its NEU boss drop files); no code changes are needed.
#
# Game facts:
#   * tier_costs / tier_xp default to NEU constants (misc.slayer_cost, leveling.slayer_boss_xp)
#     and can be overridden per slayer.
#   * level thresholds come from NEU leveling.slayer_xp[<id>].
#   * unlock rules from https://hypixelskyblock.minecraft.wiki/w/Slayer (checked 2026-10-05).
# Heuristics (labelled in the UI as SkyPilot guidance):
#   * recommended_combat / recommended_mp per tier
#   * kill_minutes: average minutes per boss *including* spawning, per gear tier
#   * gear tiers (REQUIRED / RECOMMENDED / LUXURY)

