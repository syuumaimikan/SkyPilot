# Progression guides shown in the mod (menu → Guide) with in-game waypoints.
#
# Facts come from the official Hypixel SkyBlock Wiki pages in `source` (checked on `checked`).
# `location` names a place in SkyHanni-REPO's island graphs (MIT, synced to
# data/cache/skyhanni); `island` on a step overrides the guide's island for that waypoint.
# `done` uses the requirement syntax of money_methods.toml and is evaluated against the last
# analysed profile (skill:X>=N, hotm>=N, faction>=1, crimson_rep>=N, rift_timecharms>=N).
# Waypoints point at fixed, public places (NPCs, areas, warps) - never at hidden blocks or
# collectibles - and the mod draws a straight line only; it never moves the player.

[[guides]]
id = "dwarven_mines"
island = "DWARVEN_MINES"
title = "Dwarven Mines & Heart of the Mountain"
title_ja = "ドワーフ鉱山とHeart of the Mountain"
source = "https://hypixelskyblock.minecraft.wiki/w/Dwarven_Mines ; https://hypixelskyblock.minecraft.wiki/w/Heart_of_the_Mountain"
checked = "2026-10-06"

[[guides.steps]]
title = "Reach Mining XII"
title_ja = "採掘レベル12にする"
text = "The Dwarven Mines need Mining XII. Mine in the Gold Mine and the Deep Caverns."
text_ja = "ドワーフ鉱山には採掘レベル12が必要です。金鉱山やディープ洞窟で採掘しましょう。"
done = "skill:MINING>=12"

[[guides.steps]]
title = "Rhys: “There are Dwarves?”"
title_ja = "Rhysのクエスト「There are Dwarves?」"
text = "Talk to Rhys in the Obsidian Sanctuary (bottom of the Deep Caverns) and give him 15 of any enchanted ore. This also unlocks the Heart of the Mountain."
text_ja = "ディープ洞窟の最下層（Obsidian Sanctuary）にいるRhysに、エンチャント鉱石を15個渡します。これでHeart of the Mountainも解放されます。"
island = "DEEP_CAVERNS"
location = "Rhys"
done = "hotm>=1"

[[guides.steps]]
title = "Take the Lift"
title_ja = "リフトで降りる"
text = "The Lift Operator at The Lift takes you down to the Dwarven Mines."
text_ja = "The LiftにいるLift Operatorに話しかけてドワーフ鉱山へ降ります。"
island = "DEEP_CAVERNS"
location = "Lift Operator"

[[guides.steps]]
title = "Commissions for HOTM XP"
title_ja = "コミッションでHOTM XPを稼ぐ"
text = "Commissions come from the King and the Emissaries around the mines. Each gives HOTM XP (+100 at HOTM 1, +200 at HOTM 2, +400 from HOTM 3); the first 4 each day give +900 more."
text_ja = "コミッションは王（King）や鉱山各地のEmissaryから受けます。報酬はHOTM XP（HOTM1で+100、HOTM2で+200、HOTM3以上で+400）で、1日最初の4回は+900が追加されます。"
location = "King"
done = "hotm>=3"

[[guides.steps]]
title = "The Forge"
title_ja = "フォージ"
text = "The Forger at The Forge turns materials into gear over time (see an item's Forge recipe in the item browser)."
text_ja = "The ForgeのForgerで素材から装備を時間をかけて作れます（アイテムブラウザのフォージレシピを参照）。"
location = "Forger"

[[guides.steps]]
title = "Crystal Hollows (HOTM 4)"
title_ja = "クリスタル洞窟（HOTM 4）"
text = "With Heart of the Mountain IV, Gwendolyn lets you into the Crystal Hollows for a coin fee."
text_ja = "Heart of the Mountain IV になると、Gwendolynにコインを払ってクリスタル洞窟へ入れます。"
location = "Gwendolyn"
done = "hotm>=5"

[[guides.steps]]
title = "Glacite Tunnels (HOTM 7)"
title_ja = "グレイサイトトンネル（HOTM 7）"
text = "The Glacite Tunnels need Heart of the Mountain VII and Dulin's quest “Beyond the Wall”."
text_ja = "グレイサイトトンネルにはHeart of the Mountain VIIと、Dulinのクエスト「Beyond the Wall」の完了が必要です。"
location = "Dulin"
done = "hotm>=8"

