[workspace]
resolver = "3"
members = [
    "packages/protocol",
    "packages/calculations",
    "packages/items",
    "packages/skyblock-data",
    "packages/hypixel-client",
    "services/profile-analyzer",
    "services/pricing-engine",
    "services/market-collector",
    "services/recommendation-engine",
    "services/translation",
    "apps/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/skypilot-sb/skypilot"
rust-version = "1.88"

[workspace.dependencies]
# internal
skypilot-protocol = { path = "packages/protocol" }
skypilot-calc = { path = "packages/calculations" }
skypilot-items = { path = "packages/items" }
skypilot-data = { path = "packages/skyblock-data" }
skypilot-hypixel = { path = "packages/hypixel-client" }
skypilot-profile = { path = "services/profile-analyzer" }
skypilot-pricing = { path = "services/pricing-engine" }
skypilot-collector = { path = "services/market-collector" }
skypilot-reco = { path = "services/recommendation-engine" }
skypilot-translation = { path = "services/translation" }

# external
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tokio = { version = "1.47", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "set-header", "limit", "compression-gzip", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
flate2 = "1"
base64 = "0.22"
moka = { version = "0.12", features = ["future", "sync"] }
parking_lot = "0.12"
regex = "1"
strsim = "0.11"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
argon2 = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
governor = "0.10"
ts-rs = { version = "11", features = ["serde-json-impl"] }
tar = "0.4"
proptest = "1"
async-trait = "0.1"
url = "2"
bytes = "1"
unicode-normalization = "0.1"
cookie = "0.18"
web-push-native = "0.5"
http = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
